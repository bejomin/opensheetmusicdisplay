name: CI
# replaces .appveyor

on:
  [push, pull_request, workflow_dispatch] # (all branches)
  #branches: [develop, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-modules-${{ hashFiles('package.json') }}

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install

      # - name: Lint # included in npm install
      #   run: npm run lint

      # - name: Patch VexFlow # included in npm install, npm run build
      #   run: npm run prebuildVexflow

      # - name: Build
      #   run: npm run build # included in npm install

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Test visual-regression comparator
        run: npm run test:visual:comparator

      - name: Build CH Songbook package target
        if: matrix.node-version == '26.x'
        run: npm run build:ch-songbook
